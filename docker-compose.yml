services:
  # ── MongoDB Atlas Local ──────────────────────────────────────────────────────
  # Supports $vectorSearch natively (same API as Atlas Cloud).
  # Run:  docker compose up -d
  # Stop: docker compose down
  mongodb:
    image: mongodb/mongodb-atlas-local:latest
    container_name: lka_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      DO_NOT_TRACK: "1"
    healthcheck:
      test: >
        echo 'db.runCommand("ping").ok'
        | mongosh localhost:27017/test --quiet
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Legal Knowledge Assistant API ────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - lka_data:/app/data
    env_file:
      - .env
    environment:
      MONGO_URI: "mongodb://mongodb:27017/?directConnection=true"
      MONGO_DB: "legal_knowledge_assistant"
      PIPELINE_INPUT: /data/uploads
      PIPELINE_OUTPUT: /data/reports
      LOG_LEVEL: INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── React Frontend ───────────────────────────────────────────────────────────
  # Build context is set to the frontend folder so Dockerfile.frontend can
  # use simple COPY . paths without Unicode escaping issues.
  frontend:
    build:
      context: "./frontend"
      dockerfile: ../Dockerfile.frontend
      args:
        # The browser fetches this URL directly, so it must be reachable from
        # the user's machine (not from inside Docker).
        VITE_API_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lka_data:
    driver: local
  mongodb_data:
    name: lka_mongodb_data
